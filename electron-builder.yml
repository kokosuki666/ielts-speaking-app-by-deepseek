appId: com.speakingstudio.ielts
productName: IELTS Speaking Studio
copyright: IELTS Speaking Studio

directories:
  output: release
  buildResources: build

# The desktop build ships the built frontend, the local server and the Electron shell.
# asar is disabled on purpose: the server is spawned as a real node process and
# must be able to read its files from disk.
asar: false
files:
  - dist/**/*
  - server/**/*
  - electron/**/*
  - build/icon.png
  - package.json
  - node_modules/**/*
  - '!node_modules/.bin'
  - '!node_modules/**/{test,tests,__tests__,docs,examples,*.md}'
  - '!**/*.map'

# Shipped next to the exe so users can double-click a startup diagnostic.
extraFiles:
  - from: tools/diagnose.cmd
    to: diagnose.cmd
  - from: tools/start.cmd
    to: start.cmd

# Pure-JS icon/version embedding; avoids winCodeSign symlink extraction issues.
afterPack: scripts/after-pack.cjs

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Draw the icon ourselves after packing (scripts/after-pack.cjs): the default
  # rcedit path needs winCodeSign, whose extraction requires symlink privileges.
  icon: build/icon.ico
  signAndEditExecutable: false
  sign: null

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IELTS Speaking Studio
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish: null
